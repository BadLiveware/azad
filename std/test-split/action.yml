# The GitHub side of the Azad module std/test.split (decision 0014): GitHub runs this composite action; Azad
# recognizes `uses: BadLiveware/azad/std/test-split@<ref>` and calls the module, which makes one action per file.
name: Azad std/test.split
description: Runs a command once for each file that matches. In Azad, each file is its own action, cached on its own.
inputs:
  files:
    description: Patterns of the files below the workspace, separated by spaces or new lines, such as tests/**/*.sh.
    required: true
  command:
    description: The command for each file, run from the workspace; {file} is replaced by the file's path.
    required: true
  inputs:
    description: Patterns of other files that each command reads. Azad gives each command only these and its file.
    required: false
    default: ""
  image:
    description: The image of the commands in Azad, by digest. GitHub uses the job's machine; Azad uses the job's image when this is empty.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FILES: ${{ inputs.files }}
        COMMAND: ${{ inputs.command }}
      run: |
        shopt -s globstar nullglob
        status=0
        count=0
        for pattern in $FILES; do
          for file in $pattern; do
            [ -f "$file" ] || continue
            count=$((count + 1))
            echo "::group::$file"
            if sh -c "${COMMAND//\{file\}/$file}"; then echo "$file: passed"; else echo "::error::$file failed"; status=1; fi
            echo "::endgroup::"
          done
        done
        if [ "$count" -eq 0 ]; then echo "::error::no file matches $FILES"; exit 1; fi
        exit "$status"
