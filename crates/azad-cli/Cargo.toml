[package]
name = "azad-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "azad"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
azad = { version = "0.0.0", path = "../azad" }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.4.3"
indicatif = "0.18.6"
nix = { version = "0.31.3", features = ["process", "term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
indicatif = { version = "0.18.6", features = ["in_memory"] }
regex = "1.13.1"
tempfile = "3.27.0"
