[package]
name = "azad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
allocative = "0.3.6"
anyhow = "1.0.104"
azad-gha-runner = { version = "0.0.0", path = "../azad-gha-runner" }
azad-guest = { version = "0.0.0", path = "../azad-guest" }
base64 = "0.23.1"
datafrog = "2.0.1"
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
getrandom = "0.4.3"
gix = { version = "0.90.0", default-features = false, features = ["sha1", "revision"] }
globset = "0.4.21"
hmac = "0.13"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2.191"
ring = "0.17.14"
roxmltree = "0.21.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
starlark = "0.14.2"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
ureq = "3.5.0"
yaml-rust2 = "0.13.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
