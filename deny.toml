[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Report unmaintained crates only when a workspace crate depends on them directly. starlark 0.14.2 brings in several
# (paste, derivative, fxhash, atomic-polyfill) that we cannot replace; vulnerabilities are still reported for all crates.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
