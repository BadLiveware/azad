name: Release

# Builds Azad's binaries and its two images (see the Dockerfile). Each kind of user gets an archive of its own
# (decision 0029): `azad`, the task runner; `azad-gha-runner`, for GHA workflow files; `azad-executor` with
# `azad-guest`, for CI hosts; and `azad-orchestrator`. Linux builds are static, for x86_64 and aarch64, each on a runner
# of its own architecture, so no Rust code builds under emulation. macOS gets the task runner only, because isolated
# runs and VMs need Linux.
#
# - A pull request builds everything and publishes nothing.
# - A push to main publishes the images as `main` and `sha-<commit>`, and keeps the binaries as artifacts of the run.
# - A tag `v<version>` publishes the images as `<version>`, `<major>.<minor>` and `latest`, and makes a GitHub release
#   with the binaries.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR needs lowercase names.
  RUN_IMAGE: ghcr.io/badliveware/azad
  BIN_IMAGE: ghcr.io/badliveware/azad-bin
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Archives
        run: |
          archive() {
            name="$1-${{ matrix.arch }}-unknown-linux-musl.tar.gz"
            shift
            tar -C dist -czf "archives/$name" "$@"
            (cd archives && sha256sum "$name" > "$name.sha256")
          }
          mkdir archives
          archive azad azad
          archive azad-gha-runner azad-gha-runner
          archive azad-executor azad-executor azad-guest
          archive azad-orchestrator azad-orchestrator
          for binary in azad azad-executor azad-orchestrator; do "dist/$binary" --version; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.arch }}-linux
          path: archives/

      # The images go to the registry by digest only; the job `images` gives the two architectures one tag.
      - name: Image with azad
        id: bin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: bin
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.BIN_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Image to run Azad in
        id: run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: azad
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.RUN_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }}-run,mode=max
      - name: Digests
        run: |
          mkdir -p digests/bin digests/run
          touch "digests/bin/${BIN_DIGEST#sha256:}" "digests/run/${RUN_DIGEST#sha256:}"
          echo "$BIN_IMAGE" > digests/bin/.image
          echo "$RUN_IMAGE" > digests/run/.image
        env:
          BIN_DIGEST: ${{ steps.bin.outputs.digest }}
          RUN_DIGEST: ${{ steps.run.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          include-hidden-files: true
          retention-days: 1


  macos:
    name: build (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p azad-cli --bin azad --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - name: Archive
        run: |
          name="azad-${{ matrix.target }}.tar.gz"
          mkdir archives
          tar -C target/${{ matrix.target }}/release -czf "archives/$name" azad
          (cd archives && shasum -a 256 "$name" > "$name.sha256")
      - if: matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/release/azad --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: archives/

  images:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [bin, run]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - id: name
        run: echo "image=$(cat digests/${{ matrix.image }}/.image)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        working-directory: digests/${{ matrix.image }}
        run: |
          tags=$(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
        env:
          IMAGE: ${{ steps.name.outputs.image }}

  release:
    needs: [build, macos, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
