name: CI image

# The image of Azad's own Rust tasks (`dev/ci/Dockerfile`, decision 0037). A push to main that changes it publishes it,
# for both architectures; `tasks.star` names it by the digest that the summary of this workflow's run gives.

on:
  push:
    branches: [main]
    paths: [dev/ci/**, .github/workflows/ci-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  # GHCR needs lowercase names.
  CI_IMAGE: ghcr.io/badliveware/azad-ci

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dev/ci
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.CI_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-${{ matrix.arch }}
          path: digests/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-image-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        working-directory: digests
        run: |
          tag="$CI_IMAGE:${GITHUB_SHA::12}"
          # shellcheck disable=SC2046
          docker buildx imagetools create --tag "$tag" $(printf "$CI_IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "\`$tag@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$tag@$digest"
