name: Azad
description: Run an Azad goal, with the GitHub Actions cache as its remote cache, on a Linux runner.
inputs:
  goal:
    description: The goal to run, such as //:check or .github/workflows/ci.yml. Give none with `orchestrate`.
    required: false
    default: ""
  orchestrate:
    description: "Whether to run Azad's orchestrator instead of a goal: it runs each goal whose `on` names the job's event, at the event's trust level, with a check run for each, and fails when one fails. It needs `checks: write`, and `binary` names azad-orchestrator."
    required: false
    default: "false"
  version:
    description: "The release of Azad to run, such as 0.20261103.2, or `latest`. Without it, the action runs the release that the workflow pins the action to, such as BadLiveware/azad@v0.20261103.2, and else the latest release."
    required: false
    default: ""
  binary:
    description: The path of an azad program to run instead of a release, such as one that the workflow built; of azad-orchestrator with `orchestrate`.
    required: false
    default: ""
  signing-key:
    description: The key that signs cache entries, from `azad key generate`, such as a secret. Without it, the cache is read-only.
    required: false
    default: ""
  cache:
    description: The remote cache, as `azad --cache` takes it.
    required: false
    default: gha
  jobs:
    description: How many actions may run at the same time.
    required: false
    default: "4"
  github-token:
    description: A token that reads the repository, for the history that a shallow checkout lacks, such as the commit count (decision 0021). Empty turns it off. With `orchestrate`, it also fetches the commit and writes the check runs.
    required: false
    default: ${{ github.token }}
  verbosity:
    description: "What Azad shows beyond results and errors, as `azad --verbosity` takes it: minimal, normal or diagnostic."
    required: false
    default: normal
  force:
    description: Whether to run every action that the goal needs again, even when its result is known, as `azad run --force`.
    required: false
    default: "false"
  include:
    description: Tags, separated by commas; only the tasks with one of them run, of those that the goal selects (decision 0023).
    required: false
    default: ""
  exclude:
    description: Tags, separated by commas; the tasks with one of them do not run, of those that the goal selects.
    required: false
    default: ""
outputs:
  holds:
    description: Whether the goal holds, "true" or "false".
  needed:
    description: How many actions the goal needed.
  ran:
    description: How many actions ran.
  cached:
    description: How many results were known, here or in the cache.
  failed:
    description: How many actions failed.
  skipped:
    description: How many actions were skipped because a dependency failed.
runs:
  # A JavaScript action, because GitHub gives the cache service's address and token only to JavaScript actions.
  using: node24
  main: action/index.js
